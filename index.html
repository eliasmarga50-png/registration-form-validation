
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Registration Form</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>
<body>
    <main class="container">
        <section class="form-card">
            <div class="form-header">
                <div class="logo">RF</div>
                <h1>Create Account</h1>
                <p>Enter your details to create your account.</p>
            </div>

            <form id="registrationForm" novalidate>
                <div class="form-row">
                    <div class="form-group">
                        <label for="firstName">First Name</label>
                        <input type="text" id="firstName" placeholder="Enter first name">
                        <span class="error" id="firstNameError"></span>
                    </div>

                    <div class="form-group">
                        <label for="lastName">Last Name</label>
                        <input type="text" id="lastName" placeholder="Enter last name">
                        <span class="error" id="lastNameError"></span>
                    </div>
                </div>

                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Choose a username">
                    <span class="error" id="usernameError"></span>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="example@email.com">
                    <span class="error" id="emailError"></span>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input
                        type="tel"
                        id="phone"
                        placeholder="Enter phone number"
                        inputmode="numeric"
                        maxlength="15"
                        autocomplete="tel"
                    >
                    <span class="error" id="phoneError"></span>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" placeholder="Create a password">
                        <button type="button" class="toggle-password" data-target="password" aria-label="Show password">Show</button>
                    </div>
                    <span class="error" id="passwordError"></span>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="confirmPassword" placeholder="Confirm your password">
                        <button type="button" class="toggle-password" data-target="confirmPassword" aria-label="Show confirm password">Show</button>
                    </div>
                    <span class="error" id="confirmPasswordError"></span>
                </div>

                <div class="form-group">
                    <label for="profileImage">Profile Image</label>
                    <input type="file" id="profileImage" accept=".png,.jpeg,.jpg">
                    <span class="error" id="profileImageError"></span>

                    <div class="image-preview-container" id="imagePreviewContainer" hidden>
                        <img id="imagePreview" alt="Selected profile image preview">
                        <span>Image preview</span>
                    </div>
                </div>

                <button type="submit" class="submit-btn">Create Account</button>

                <div id="formMessage" role="status" aria-live="polite"></div>
            </form>
        </section>
    </main>
</body>
</html>
